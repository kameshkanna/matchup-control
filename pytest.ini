[pytest]
# Make the repo root (this directory, which contains the `matchup` package)
# importable, and keep test discovery scoped to tests/.
#   pythonpath = .  -> adds the rootdir to sys.path so `import matchup` works
#                      no matter which directory pytest is launched from.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v
